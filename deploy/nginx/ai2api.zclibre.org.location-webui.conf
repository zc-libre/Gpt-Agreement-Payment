# Gpt-Agreement-Payment webui — nginx 反代片段
#
# 把这段插到现有 ai2api.zclibre.org HTTPS server 块内（同其它 location 平级），
# 别的 server / SSL 配置保持原样。一键应用：
#   sudo cp .../ai2api.zclibre.org.conf{,.bak.$(date +%s)}
#   # 用编辑器把下面这段插入到 server { ... } 内
#   sudo nginx -t && sudo nginx -s reload
#
# 反代到 webui systemd 服务（默认 listen 127.0.0.1:8765）。
# Host 名 + 路径前缀（/webui/）跟前端构建时 vite base 一致。

    # --- gpt-pp webui (Gpt-Agreement-Payment) ---
    location /webui/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE / streaming（webui 运行控制器用 sse-starlette 推实时日志）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 100M;
    }
